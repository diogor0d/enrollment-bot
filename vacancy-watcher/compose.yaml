name: inforestudante-vacancy-watcher

services:
  vacancy-watcher:
    build: .
    user: "${WATCHER_UID:-1000}:${WATCHER_GID:-1000}"
    init: true
    shm_size: 256m
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-m", "vacancy_watcher", "health-service"]
      interval: 1m
      timeout: 10s
      start_period: 2m
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      HOME: /tmp/home
      XDG_CACHE_HOME: /tmp/xdg-cache
      XDG_CONFIG_HOME: /tmp/xdg-config
      MODE: ${MODE:-notify}
      ENABLE_ENROLLMENT: ${ENABLE_ENROLLMENT:-false}
      ENROLLMENT_ACK: ${ENROLLMENT_ACK:-}
      STORAGE_STATE_PATH: /data/auth-state.json
      DATA_PATH: /data/state.json
      POLL_INTERVAL: ${POLL_INTERVAL:-30}
      POLL_JITTER: ${POLL_JITTER:-2}
      AUTH_RETRY_INTERVAL: ${AUTH_RETRY_INTERVAL:-900}
      STOP_AFTER_SUCCESS: ${STOP_AFTER_SUCCESS:-true}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      UI_ALLOWED_HOSTS: ${UI_ALLOWED_HOSTS:-}
      # Docker rewrites host-originated published-port traffic to this fixed
      # project gateway; retain it so loopback health/operator access works.
      UI_ALLOWED_CLIENTS: ${UI_ALLOWED_CLIENTS:-10.89.0.1}
      TLS_ENABLED: ${TLS_ENABLED:-false}
      TLS_CERT_PATH: /data/tls.crt
      TLS_KEY_PATH: /data/tls.key
    ports:
      - "${WATCHER_BIND_ADDRESS:-127.0.0.1}:18782:8080"
    volumes:
      - ./data:/data

networks:
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/28
